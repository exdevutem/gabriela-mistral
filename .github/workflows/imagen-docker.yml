# Construye la imagen del contenedor y la publica en GitHub Packages (ghcr.io).
#
# El build es largo —compila llama-server desde las fuentes e instala torch—,
# así que no corre en cada push: sólo al empujar una etiqueta `v*` y a mano
# desde la pestaña Actions, que es de donde salen las imágenes de prueba.
#
# Necesita `assets/gabriela.glb`, que NO está en el repositorio: su licencia es
# la de FLAME (investigación y uso no comercial) y la descarga de FLAME exige
# registro, así que no se puede generar aquí. Hay que dárselo ya hecho, por una
# de estas dos vías (ver docker/README.md):
#
#   1. El secreto `GABRIELA_GLB_URL` con un enlace directo de descarga.
#   2. Un adjunto llamado `gabriela.glb` en una release del repositorio. La
#      variable `GABRIELA_GLB_RELEASE` elige cuál; vacía, se usa la última.
name: Imagen Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta extra para la imagen (ej. 0.1.0). Vacío, sólo rama y sha."
        required: false
        default: ""
      llama_tag:
        description: "Tag de llama.cpp a compilar. `master` no es reproducible."
        required: false
        default: "master"
      publicar:
        description: "Subir la imagen a ghcr.io. Desmárcalo para sólo probar el build."
        type: boolean
        required: false
        default: true

env:
  IMAGEN: ghcr.io/${{ github.repository }}

# Dos builds a la vez sobre la misma rama sólo se pelean por la caché.
concurrency:
  group: imagen-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    # El stage de llama.cpp más la instalación de torch no bajan de media hora.
    timeout-minutes: 120
    permissions:
      contents: read   # para bajar el .glb adjunto a una release
      packages: write  # para empujar a ghcr.io

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # El runner viene con ~10 GB de SDKs que aquí no usa nadie, y entre el
      # stage de compilación y las ruedas de torch la imagen pasa de 6 GB.
      - name: Hacer sitio en el disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Conseguir assets/gabriela.glb
        env:
          GH_TOKEN: ${{ github.token }}
          GLB_URL: ${{ secrets.GABRIELA_GLB_URL }}
          GLB_RELEASE: ${{ vars.GABRIELA_GLB_RELEASE }}
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ -n "${GLB_URL}" ]; then
            echo "Bajando el busto desde el secreto GABRIELA_GLB_URL."
            if ! curl -fsSL --retry 3 --retry-delay 5 -o assets/gabriela.glb "${GLB_URL}"; then
              echo "::error::GABRIELA_GLB_URL no responde o el enlace caducó."
              exit 1
            fi
          else
            echo "Sin GABRIELA_GLB_URL: lo busco como adjunto de una release."
            if ! gh release download ${GLB_RELEASE:+"${GLB_RELEASE}"} \
                   --repo "${{ github.repository }}" \
                   --pattern gabriela.glb --dir assets --clobber; then
              echo "::error::No hay ningún gabriela.glb que copiar. Genéralo con el pipeline (ver README) y súbelo como adjunto de una release, o define el secreto GABRIELA_GLB_URL. Los detalles están en docker/README.md."
              exit 1
            fi
          fi
          # Un .glb binario empieza por el magic «glTF». Si lo que bajó es un
          # HTML de error, se cae aquí y no media hora después, en el COPY.
          test -s assets/gabriela.glb
          if [ "$(head -c 4 assets/gabriela.glb)" != "glTF" ]; then
            echo "::error::El archivo descargado no es un .glb (no empieza por «glTF»)."
            exit 1
          fi
          ls -lh assets/gabriela.glb

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # Se entra siempre, aunque no se vaya a publicar: la caché del build
      # también vive en el registro.
      - name: Entrar a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Calcular etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          # `latest` sale solo, y sólo desde una etiqueta semver (latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Gabriela Mistral
            org.opencontainers.image.description=Busto 3D conversacional de Gabriela Mistral

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          # El cluster es amd64 y compilar llama.cpp bajo QEMU costaría horas.
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publicar }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LLAMA_TAG=${{ inputs.llama_tag || 'master' }}
          # La caché va al propio registro y no a la de Actions: `mode=max`
          # guarda también el stage de llama.cpp —lo que de verdad cuesta— y
          # eso solo no cabe en los 10 GB por repositorio que da Actions.
          cache-from: type=registry,ref=${{ env.IMAGEN }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGEN }}:buildcache,mode=max
          # Proxmox 9 arma el LXC a partir del manifiesto OCI; las firmas de
          # procedencia le cuelgan manifiestos «unknown/unknown» que sólo
          # ensucian la lista del paquete.
          provenance: false

      - name: Resumen
        env:
          ETIQUETAS: ${{ steps.meta.outputs.tags }}
          PUBLICADA: ${{ github.event_name != 'workflow_dispatch' || inputs.publicar }}
        run: |
          set -euo pipefail
          if [ "${PUBLICADA}" = "true" ]; then
            titulo="Imagen publicada"
          else
            titulo="Imagen construida, sin publicar"
          fi
          {
            echo "### ${titulo}"
            echo
            echo '```'
            echo "${ETIQUETAS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
