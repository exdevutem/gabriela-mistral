[project]
name = "gabriela"
version = "0.1.0"
description = "Busto 3D conversacional de Gabriela Mistral"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "mediapipe==0.10.35",
    "pygltflib",
    "fastapi",
    "uvicorn[standard]",
    "google-genai",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gabriela"]
