[project]
name = "gabriela"
version = "0.1.0"
description = "Busto 3D conversacional de Gabriela Mistral"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "mediapipe==0.10.35",
    "pygltflib",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "neutts",
    # neucodec (vía neutts) arrastra torchtune, que en 0.18 no encuentra
    # torchao.dtypes.nf4tensor y revienta al importar. Probadas: 0.14 y 0.16 sí.
    "torchao>=0.14,<0.18",
    "huggingface-hub",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gabriela"]
