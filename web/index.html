<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriela Mistral</title>
<script type="importmap">
{"imports": {
  "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
}}
</script>
<style>
  :root { --tinta: #e8e0d4; --fondo: #14100e; --tenue: #8b8175; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
         background: var(--fondo); color: var(--tinta);
         font: 16px/1.6 "Iowan Old Style", Georgia, serif; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  #pie { padding: 1rem 1.25rem 1.5rem; display: flex; flex-direction: column;
         gap: .75rem; max-width: 46rem; width: 100%; margin: 0 auto; }
  #dicho { min-height: 3.2em; margin: 0; font-size: 1.15rem; }
  #dicho.pensando { color: var(--tenue); font-style: italic; }
  #dicho.error { color: #f0b7a4; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .7rem .9rem; border-radius: .4rem; font: inherit;
          background: #1e1917; color: var(--tinta); border: 1px solid #352d28; }
  input:focus { outline: 2px solid #7a6a55; outline-offset: 1px; }
  button { padding: .7rem 1.3rem; border: 0; border-radius: .4rem; font: inherit;
           background: #7a6a55; color: #14100e; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #microfono { background: transparent; color: var(--tinta); border: 1px solid #7a6a55; }
  #microfono[aria-pressed="true"] { background: #a5523f; border-color: #a5523f; color: var(--tinta); }
  #microfono[hidden] { display: none; }
  #aviso { margin: 0; font-size: .78rem; color: var(--tenue); text-align: center; }
  /* Preguntas frecuentes: una sola fila que se arrastra. En vertical ocuparían
     cuatro filas y le comerían la cara, que es lo que la gente vino a ver. */
  #badges { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .15rem;
            scrollbar-width: thin; scrollbar-color: #352d28 transparent;
            /* Difumina los bordes para que se vea que la fila sigue. */
            mask-image: linear-gradient(90deg, transparent, #000 1.2rem,
                        #000 calc(100% - 1.2rem), transparent); }
  #badges button { flex: 0 0 auto; padding: .35rem .8rem; border-radius: 1rem;
                   font-size: .82rem; background: transparent; color: var(--tenue);
                   border: 1px solid #352d28; cursor: pointer; }
  #badges button:hover:not(:disabled) { color: var(--tinta); border-color: #7a6a55; }
  #badges button:focus-visible { outline: 2px solid #7a6a55; outline-offset: 1px; }
  /* Reproductor de la respuesta: pausa, detener y una barra que se puede
     arrastrar, con el tiempo al lado. */
  #reproductor { display: flex; align-items: center; gap: .6rem; }
  #reproductor[hidden] { display: none; }
  #reproductor button { padding: .35rem .7rem; min-width: 2.6rem; font-size: .9rem;
                        background: transparent; color: var(--tinta);
                        border: 1px solid #352d28; }
  #reproductor button:hover { border-color: #7a6a55; }
  #reproductor button:focus-visible { outline: 2px solid #7a6a55; outline-offset: 1px; }
  #barra { flex: 1; accent-color: #7a6a55; min-width: 0; }
  #tiempo { font-size: .82rem; color: var(--tenue); font-variant-numeric: tabular-nums;
            white-space: nowrap; }
  /* Lo que va entendiendo mientras el visitante habla. */
  #dicho.escuchando { color: var(--tenue); }
  #dicho.escuchando::after { content: ' ●'; color: #a5523f;
                             animation: latido 1.2s steps(1) infinite; }
  @keyframes latido { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) {
    #dicho.escuchando::after { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="lienzo" aria-label="Retrato animado de Gabriela Mistral"></canvas>
  <div id="pie">
    <p id="dicho" role="status" aria-live="polite"></p>
    <div id="reproductor" role="group" aria-label="Reproducción de la respuesta" hidden>
      <button id="pausa" type="button" aria-label="Pausar">❚❚</button>
      <button id="detener" type="button" aria-label="Detener">■</button>
      <input id="barra" type="range" min="0" max="0" step="0.1" value="0"
             aria-label="Avance de la respuesta">
      <span id="tiempo">0:00 / 0:00</span>
    </div>
    <div id="badges" role="group" aria-label="Preguntas frecuentes"></div>
    <form id="forma">
      <input id="entrada" autocomplete="off" autofocus
             placeholder="Pregúntale algo…" aria-label="Tu mensaje">
      <button id="microfono" type="button" aria-pressed="false" hidden>Hablarle</button>
      <button id="enviar" type="submit">Preguntar</button>
    </form>
    <p id="aviso">Recreación con inteligencia artificial. No es una grabación
      ni un testimonio real de Gabriela Mistral (1889–1957).</p>
  </div>

<script type="module">
import { crearAvatar } from './static/avatar.js';

const dicho = document.getElementById('dicho');
const entrada = document.getElementById('entrada');
const enviar = document.getElementById('enviar');
const forma = document.getElementById('forma');
const badges = document.getElementById('badges');
const microfono = document.getElementById('microfono');

// Sin try, un GLB que falta o viene corrupto aborta el módulo entero: no se
// crea el WebSocket, no se registra ningún handler y el kiosco queda negro y
// mudo, sin nada que permita diagnosticarlo desde la sala. Con él, se pierde
// la cara pero la voz sigue sirviendo.
let avatar = null, avisoRetrato = '';
try {
  avatar = await crearAvatar(document.getElementById('lienzo'));
} catch (e) {
  // Se guarda además de mostrarse: el 'listo' del WebSocket llega unos
  // milisegundos después y limpia #dicho, que se comparte con la conversación.
  // Sin esto, el fallo del retrato se borraría solo y quedaría un lienzo negro
  // sin explicación, que es justo lo que este catch viene a evitar.
  avisoRetrato = 'No se pudo cargar el retrato. Avisa al personal del museo.';
  dicho.className = 'error';
  dicho.textContent = avisoRetrato;
  console.error(e);
}

// Un corte de red dejaba la pantalla muerta hasta que alguien fuera a
// reiniciarla. En un kiosco desatendido eso son horas de busto mudo, así que
// reconecta sola, espaciando los intentos para no martillear al servidor
// mientras arranca.
let ws, reintentos = 0;
function conectar() {
  const esquema = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${esquema}://${location.host}/ws`);
  ws.onmessage = alMensaje;
  ws.onopen = () => { reintentos = 0; };
  ws.onclose = () => {
    dicho.className = 'error';
    dicho.textContent = 'Se cortó la conexión con el servidor. Reconectando…';
    ocupado(true);
    setTimeout(conectar, Math.min(1000 * 2 ** reintentos++, 15000));
  };
}
const ocupado = (si) => {
  enviar.disabled = si; entrada.disabled = si; microfono.disabled = si;
  for (const b of badges.children) b.disabled = si;
  if (!si) entrada.focus();
};
ocupado(true);

// --- Reproductor ---
// Todo lo lee y lo manda al <audio> del avatar: pausar, reanudar y adelantar
// son los del elemento tal cual. Aparece cuando llega una respuesta y se va
// cuando termina o se detiene; el silencio con que se desbloquea el audio no
// cuenta como respuesta, y por eso no se muestra solo con 'play'.
const reproductor = document.getElementById('reproductor');
const pausa = document.getElementById('pausa');
const detener = document.getElementById('detener');
const barra = document.getElementById('barra');
const tiempo = document.getElementById('tiempo');
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let arrastrando = false;

function pintar() {
  const a = avatar?.audio;
  if (!a || reproductor.hidden) return;
  const total = Number.isFinite(a.duration) ? a.duration : 0;
  if (!arrastrando) barra.value = a.currentTime;
  barra.max = total;
  tiempo.textContent = `${mmss(arrastrando ? barra.value : a.currentTime)} / ${mmss(total)}`;
  const pausado = a.paused;
  pausa.textContent = pausado ? '▶' : '❚❚';
  pausa.setAttribute('aria-label', pausado ? 'Reanudar' : 'Pausar');
}
function ocultarReproductor() { reproductor.hidden = true; }

if (avatar) {
  const a = avatar.audio;
  for (const ev of ['timeupdate', 'play', 'pause', 'loadedmetadata']) a.addEventListener(ev, pintar);
  a.addEventListener('ended', ocultarReproductor);
  a.addEventListener('detenido', ocultarReproductor);
  pausa.onclick = () => (a.paused ? a.play() : a.pause());
  detener.onclick = () => avatar.detener();
  barra.oninput = () => { arrastrando = true; pintar(); };
  barra.onchange = () => { a.currentTime = Number(barra.value); arrastrando = false; pintar(); };
}

function alMensaje({ data }) {
  const m = JSON.parse(data);
  if (m.tipo === 'listo')    {
    dicho.className = avisoRetrato ? 'error' : '';
    dicho.textContent = avisoRetrato;
    // Se reconecta sola, y el servidor manda 'listo' en cada conexión: sin
    // vaciar, cada corte de red dejaría otra copia entera de la fila.
    badges.replaceChildren();
    // Sólo llegan las que tienen la respuesta ya grabada, así que un badge
    // siempre responde al instante.
    for (const pregunta of m.frecuentes || []) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = pregunta;
      b.onclick = () => preguntar(pregunta);
      badges.append(b);
    }
    ocupado(false);
  }
  if (m.tipo === 'pensando') { dicho.className = 'pensando'; dicho.textContent = 'pensando…'; }
  if (m.tipo === 'parcial' && grabando) {
    // Lo que Whisper va entendiendo mientras el visitante todavía habla.
    dicho.className = 'escuchando';
    dicho.textContent = `«${m.texto}…»`;
  }
  if (m.tipo === 'oido')     {
    // Lo que entendió Whisper, mientras se elige la respuesta: si contesta
    // otra cosa, el visitante ve por qué.
    dicho.className = 'pensando';
    dicho.textContent = m.texto ? `«${m.texto}»` : 'No te oí bien.';
  }
  if (m.tipo === 'texto')    {
    dicho.className = '';
    dicho.textContent = m.texto;
  }
  if (m.tipo === 'habla')    {
    // La respuesta entera en un audio. Una nueva corta a la anterior: se puede
    // preguntar otra cosa sin esperar a que termine.
    avatar?.detener();
    reproductor.hidden = !avatar;
    // Si el navegador bloquea la reproducción automática, la boca se movería en
    // silencio y nadie sabría por qué. Mejor decirlo.
    (avatar?.hablar(m.audio, m.visemas) ?? Promise.resolve()).catch(() => {
      dicho.textContent += '\n\n(El navegador bloqueó el audio: haz clic en la página y vuelve a preguntar.)';
    });
    ocupado(false);
  }
  if (m.tipo === 'error')    {
    dicho.className = 'pensando'; dicho.textContent = m.texto;
    ocupado(false);
  }
};
conectar();

/**
 * Manda una pregunta. Tiene que llamarse DENTRO del gesto del usuario —el
 * submit o el clic en un badge—: es el único momento en que Safari concede el
 * permiso de reproducir audio, y la voz no llega hasta segundos después.
 */
function preguntar(texto) {
  avatar?.desbloquear();
  ws.send(JSON.stringify({ tipo: 'pregunta', texto }));
  entrada.value = '';
  ocupado(true);
}

// --- Micrófono ---
// Se toca una vez para hablar y otra para terminar; a los SEGUNDOS_MAX se corta
// solo, para que un botón olvidado no deje el kiosco escuchando la sala.
//
// Lo grabado sale en trozos de ~¼ s mientras se habla, y el servidor devuelve
// lo que Whisper va entendiendo: la transcripción en vivo. Va como PCM de 16
// bits a 16 kHz, que es lo que lee Whisper; convertirlo aquí le ahorra al
// servidor depender de ffmpeg.
//
// getUserMedia sólo existe en contexto seguro (https o localhost). Servido por
// http desde otra máquina, el botón no aparece y quedan el texto y los badges.
const SEGUNDOS_MAX = 8;
// Un AudioWorklet que sólo copia lo que oye al hilo principal. Inline para no
// servir otro archivo.
const CAPTURA = URL.createObjectURL(new Blob([`
  registerProcessor('captura', class extends AudioWorkletProcessor {
    process([entrada]) {
      if (entrada[0]) this.port.postMessage(entrada[0].slice());
      return true;
    }
  });`], { type: 'text/javascript' }));
let grabando = null, corte = 0;
if (navigator.mediaDevices?.getUserMedia && window.AudioWorkletNode) microfono.hidden = false;

microfono.onclick = async () => {
  if (grabando) { terminar(); return; }
  avatar?.desbloquear();  // dentro del gesto, igual que preguntar()
  avatar?.detener();      // que el micrófono no la oiga a ella
  let flujo;
  try {
    flujo = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    dicho.className = 'error';
    dicho.textContent = 'No tengo permiso para usar el micrófono.';
    return;
  }
  const ctx = new AudioContext();
  await ctx.audioWorklet.addModule(CAPTURA);
  const nodo = new AudioWorkletNode(ctx, 'captura');
  ctx.createMediaStreamSource(flujo).connect(nodo);
  let pendiente = [], muestras = 0;
  nodo.port.onmessage = ({ data }) => {
    pendiente.push(data);
    muestras += data.length;
    if (muestras >= ctx.sampleRate / 4) {
      ws.send(a16k(pendiente, ctx.sampleRate));
      pendiente = []; muestras = 0;
    }
  };
  grabando = { flujo, ctx, enviarResto: () => pendiente.length && ws.send(a16k(pendiente, ctx.sampleRate)) };
  for (const b of badges.children) b.disabled = true;
  enviar.disabled = true; entrada.disabled = true;
  microfono.setAttribute('aria-pressed', 'true');
  microfono.textContent = 'Escuchando… toca para terminar';
  dicho.className = 'escuchando';
  dicho.textContent = 'Te escucho';
  corte = setTimeout(terminar, SEGUNDOS_MAX * 1000);
};

function terminar() {
  if (!grabando) return;
  clearTimeout(corte);
  const { flujo, ctx, enviarResto } = grabando;
  grabando = null;
  enviarResto();
  flujo.getTracks().forEach((t) => t.stop());
  ctx.close();
  ws.send(JSON.stringify({ tipo: 'fin' }));
  microfono.setAttribute('aria-pressed', 'false');
  microfono.textContent = 'Hablarle';
  ocupado(true);
}

/** Trozos en float a la frecuencia del micrófono -> PCM de 16 bits a 16 kHz.
 *  ponytail: interpolación lineal sin filtro antialias. Para voz y Whisper
 *  alcanza; si alguna vez se oye metálico, un OfflineAudioContext remuestrea
 *  con filtro. */
function a16k(trozos, origen) {
  const x = new Float32Array(trozos.reduce((n, t) => n + t.length, 0));
  let i = 0;
  for (const t of trozos) { x.set(t, i); i += t.length; }
  const paso = origen / 16000, n = Math.floor(x.length / paso);
  const pcm = new Int16Array(n);
  for (let j = 0; j < n; j++) {
    const p = j * paso, k = Math.floor(p), f = p - k;
    const v = x[k] * (1 - f) + (x[k + 1] ?? x[k]) * f;
    pcm[j] = Math.max(-1, Math.min(1, v)) * 32767;
  }
  return pcm.buffer;
}

forma.onsubmit = (e) => {
  e.preventDefault();
  const texto = entrada.value.trim();
  if (texto) preguntar(texto);
};
</script>
</body>
</html>
